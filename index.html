<style>
:root{
  --bg:#F5F2ED;--card:#FFFFFF;--ink:#0B2E3E;--mut:#5F7681;--line:#E4DFD6;
  --acc:#407E8D;--acc-ink:#FFFFFF;--acc-soft:#DEEBED;
  --pos:#12805C;--pos-soft:#DDF3EA;--neg:#D0392F;--neg-soft:#FBE4E1;--amb:#8A6D3F;--amb-soft:#F1EAE0;
  --c1:#083B50;--c2:#A28E69;--c3:#407E8D;--c4:#7FB3BE;
  --shadow:0 1px 0 rgba(8,59,80,.05),0 10px 28px -16px rgba(8,59,80,.22);
  --nav:rgba(255,255,255,.92);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071E29;--card:#0E3040;--ink:#EDE9E2;--mut:#9FB4BC;--line:#1C4152;
    --acc:#5FAAB9;--acc-ink:#052029;--acc-soft:#123B48;
    --pos:#3DD6A0;--pos-soft:#12372E;--neg:#FF7E72;--neg-soft:#3F1D1D;--amb:#D8BE93;--amb-soft:#3A2E1C;
    --c1:#6FA8BE;--c2:#D8BE93;--c3:#5FAAB9;--c4:#8FCBD3;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6);--nav:rgba(14,48,64,.92);
  }
}
:root[data-theme="dark"]{
  --bg:#071E29;--card:#0E3040;--ink:#EDE9E2;--mut:#9FB4BC;--line:#1C4152;
  --acc:#5FAAB9;--acc-ink:#052029;--acc-soft:#123B48;
  --pos:#3DD6A0;--pos-soft:#12372E;--neg:#FF7E72;--neg-soft:#3F1D1D;--amb:#D8BE93;--amb-soft:#3A2E1C;
  --c1:#6FA8BE;--c2:#D8BE93;--c3:#5FAAB9;--c4:#8FCBD3;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6);--nav:rgba(14,48,64,.92);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
#app{max-width:560px;margin:0 auto;padding:12px 14px calc(110px + env(safe-area-inset-bottom))}
.pad{padding-left:2px;padding-right:2px}
.mut{color:var(--mut)}.sm{font-size:12.5px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.acc{color:var(--acc)}.amb{color:var(--amb)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ph{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:10px 2px 14px}
.warn{background:var(--amb-soft);color:var(--amb);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px}

/* navegação de mês */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:0 -14px 10px;padding:8px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);box-shadow:0 1px 0 var(--line)}
.mlabel{background:none;border:0;font-weight:700;font-size:17px;letter-spacing:-.01em;padding:6px 10px;border-radius:10px}
.ib{width:38px;height:38px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--line)}

/* hero */
.hero{background:var(--card);border-radius:22px;padding:20px 18px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero .lab{color:var(--mut);font-size:13px;font-weight:600}
.hero .num{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 4px}
.hero .sub{color:var(--mut);font-size:13.5px;margin-bottom:14px}
.flow{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--line);gap:2px}
.flow i{display:block;height:100%}
.flow i:first-child{border-radius:8px 0 0 8px}
.s1{background:var(--c1)}.s2{background:var(--c2)}.s3{background:var(--c3)}.s4{background:var(--c4)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px;font-size:13px}
.legend span{display:flex;align-items:center;gap:7px;color:var(--mut)}
.legend span i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;color:var(--ink);font-weight:600}

/* cartões */
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;width:100%}
.card-h h3{font-size:15px;font-weight:700}
.btn-h{background:none;border:0;padding:0;text-align:left;margin-bottom:0}
.card .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12.5px;color:var(--mut);font-weight:600}.stat b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.card>.kv:first-of-type,.card-h+.kv{border-top:0}
.kv span{color:var(--mut)}.kv b{font-weight:600;text-align:right}
.kv.tot{border-top:1.5px solid var(--ink);margin-top:2px}.kv.tot span{color:var(--ink);font-weight:700}.kv.tot b{font-weight:800}
.link{background:none;border:0;color:var(--acc);font-weight:600;padding:10px 0 2px;font-size:14px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}.sec-h h3{font-size:16px;font-weight:700}
.fat-subh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:14px 0 4px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.fat-subh:first-child{margin-top:0;padding-top:0;border-top:0}
.fat-subh b{font-size:13.5px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:700}
h4{display:flex;justify-content:space-between;margin:16px 0 4px;font-size:14px}

/* barras */
.hb{margin:10px 0}.hb-t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}.hb-t b{font-weight:600}
.hb-b{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.hb-b i{display:block;height:100%;background:var(--acc);border-radius:6px}
.hb-b.over i{background:var(--neg)}
.env{margin:12px 0}.env-t{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px}.env-t .mut{font-weight:400;font-size:13px}
.env-s{font-size:12.5px;color:var(--mut);margin-top:5px}

/* lista */
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;min-height:52px}
.card .row:first-of-type{border-top:0}
.day+.row{border-top:0}
.day{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);font-weight:600;margin:16px 4px 2px}
.day b{font-weight:600}
.day + .row, .day ~ .row{background:var(--card)}
.r-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.r-main b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-amt{font-weight:700;font-size:15px;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-style:normal;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--mut)}
.tag.acc{background:var(--acc-soft);color:var(--acc)}
.pay-cartao{background:var(--amb-soft);color:var(--amb)}.pay-vavr{background:var(--pos-soft);color:var(--pos)}
.big-row{border:0;background:var(--card);border-radius:16px;margin-bottom:10px;padding:14px;box-shadow:var(--shadow)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.empty{text-align:center;padding:36px 20px;color:var(--mut)}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips.pad{margin:0 2px 4px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;min-height:40px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip.ghost{border-style:dashed;color:var(--mut)}
.chip.sm{font-size:13px;padding:7px 12px;min-height:34px;font-weight:500}.chip.sm b{font-weight:700;margin-left:4px}
.seg{display:flex;background:var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 6px;font-weight:600;font-size:14px;color:var(--mut);min-height:42px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg.wide{margin-bottom:12px}
.subh{display:flex;align-items:center;gap:6px;margin:4px 0 12px}.subh h1{font-size:22px;font-weight:800;letter-spacing:-.02em}

/* caixinhas */
.cx{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.cx-t{display:flex;justify-content:space-between;font-size:16px;margin-bottom:4px}.cx-t b:last-child{font-weight:800}
.cx-b{display:flex;justify-content:space-between;font-size:13px;margin:6px 0 0;gap:10px}.cx .hb-b{margin-top:8px}
.cx-n{font-size:12.5px;color:var(--amb);margin-top:8px}
.row-btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.row-btns .btn{flex:1}
.inl{display:flex;align-items:center;gap:6px}

/* inputs / botões */
.in{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;min-height:46px}
.in.sm{width:86px;text-align:right;min-height:40px;padding:8px 10px}

const card = (title, body, right = '', id = '') => `<section class="card" ${id ? `id="${id}"` : ''}><div class="card-h"><h3>${title}</h3>${right}</div>${body}</section>`;
const kv = (k, v, c = '') => `<div class="kv"><span>${k}</span><b class="${c}">${v}</b></div>`;
const stat = (k, v, c = '') => `<div class="stat"><span>${k}</span><b class="${c}">${v}</b></div>`;
// tem VA/VR separado do salário? (contas que somaram o VA/VR ao salário, ou sem VA/VR, não mostram o controle do VA/VR)
const hasVA = () => S.vaSep !== false && (S.env.some(e => e.monthly > 0.004) || S.fixed.some(f => f.id === 'f_vavr'));
const bars = (rows, max) => rows.map(r => `<div class="hb"><div class="hb-t"><span>${esc(r.l)}</span><b>${brl(r.v)}</b></div><div class="hb-b"><i style="width:${Math.min(100, max ? r.v / max * 100 : 0)}%;${r.c ? `background:${r.c}` : ''}"></i></div></div>`).join('');
const empty = (t, s) => `<div class="empty"><b>${t}</b><p>${s}</p></div>`;

// ---------- descritivo do cartão ----------
function setAdv(S, ym, key, a) { S.adv = S.adv || {}; S.adv[ym] = S.adv[ym] || {}; if (a > 0.004) S.adv[ym][key] = Core.round2(a); else delete S.adv[ym][key]; }
function advChip(ym, key, v) {
  const a = Math.min(M.advOf(ym, key), v);
  return `<button class="chip sm ${a > 0 ? 'on' : ''}" data-act="adv" data-ym="${ym}" data-k="${key}" data-v="${v}">${a > 0 ? `Adiantado ${fmtNum(a)}` : 'Adiantado'}</button>`;
}
ACT.adv = el => {
  const ym = el.dataset.ym, key = el.dataset.k, full = +el.dataset.v, cur = M.advOf(ym, key);
  openForm({
    title: 'Adiantado', v: { a: cur > 0.004 ? String(cur).replace('.', ',') : '' },
    fields: [{ t: 'text', k: 'a', label: 'Valor que você já pagou', ph: `Ex.: ${fmtNum(full)} (valor cheio)` },
      { t: 'note', html: cur > 0.004 ? `Já marcado como adiantado: ${brl(cur)} de ${brl(full)}. Apague o valor ou deixe 0 para tirar o adiantado.` : `Vale de 0 até ${brl(full)}. É descontado do “a pagar” da fatura de ${ymLabel(ym)}.` }],
    save: f => { const t2 = String(f.a || '').trim(); const a = t2 === '' ? 0 : Core.calc(t2); if (!(a >= 0)) return 'Digite um valor válido.'; commit(S => setAdv(S, ym, key, Math.min(a, full)), a > 0.004 ? 'Adiantado registrado' : 'Adiantado removido'); return true; }
  });
};
function faturaDesc(y) {
  const adv = M.advSum(y), tot = M.fatura(y), aPag = M.aPagar(y), plan = M.faturaPlan(y);
  return `<div class="kv tot"><span>Fatura de ${ymLabel(y)}</span><b>${brl(tot)}</b></div>${adv > 0.004 ? kv('Já adiantado', '−' + brl(adv)) + `<div class="kv tot"><span>A pagar</span><b>${brl(aPag)}</b></div>` : ''}${plan - tot > 0.004 ? kv('Previsto (com os agendados que ainda vão entrar)', brl(plan)) : ''}<p class="mut sm" style="margin:.5rem 0 0">Fecha dia ${S.closeDay || 1}. Compras a partir desse dia entram na fatura de ${ymLabel(Core.addM(y, 1))}.</p>${cardLines(y)}`;
}
// ---------- descritivo das entradas e saídas (cabeçalho) ----------
function txRowSheet(t, tagExtra = '') {
  return `<button class="row" data-act="edtx" data-id="${t.id}"><span class="r-main"><b>${esc(t.desc || t.cat)}</b><span class="tags"><i class="tag">${dmy(t.d)}/${t.d.slice(0, 4)}</i><i class="tag">${esc(t.cat)}</i>${tagExtra}</span></span><span class="r-amt ${t.t === 'in' ? 'pos' : ''}">${brl(t.v).replace('−', '')}</span></button>`;
}
const secHead = (l, v, note = '') => `<div class="kv tot" style="margin-top:.9rem"><span>${l}</span><b>${brl(v)}</b></div>${note ? `<p class="mut sm" style="margin:.1rem 0 .3rem">${note}</p>` : ''}`;
ACT.hopen = el => {
  const ym = el.dataset.ym || UI.ym, k = el.dataset.k, d = M.dashboard(ym);
  if (k === 'ent') {
    const fx = M.fixedIn(ym).filter(x => Math.abs(x.v) > 0.004), rc = M.B(ym).in.filter(t => t.st !== 'rec').sort((a, b) => a.d < b.d ? 1 : -1), pend = M.B(ym).in.filter(t => t.st === 'rec').sort((a, b) => a.d < b.d ? 1 : -1);
    openInfo(`Entradas · ${ymLabel(ym)}`,
      `<div class="kv tot"><span>Total de entradas</span><b class="pos">${brl(d.ent)}</b></div>` +
      (fx.length ? secHead('Fixas', sum(fx, x => x.v)) + fx.map(x => `<div class="kv"><span>${esc(x.f.name)}</span><b>${brl(x.v)}</b></div>`).join('') : '') +
      (rc.length ? secHead('Recebido', sum(rc, t => t.v)) + rc.map(t => txRowSheet(t)).join('') : '') +
      (pend.length ? secHead('A receber (não soma até receber)', sum(pend, t => t.v)) + pend.map(t => txRowSheet(t, '<i class="tag acc">A receber</i>')).join('') : '') +
      (!fx.length && !rc.length && !pend.length ? '<p class="mut">Nenhuma entrada neste mês.</p>' : ''));
    return;
  }
  const fixos = M.fixedOf(ym, 'out').filter(x => !x.f.inFatura && Math.abs(x.v) > 0.004), fat = M.fatura(ym), adv = M.advSum(ym);
  const va = M.B(ym).vavr.slice().sort((a, b) => a.d < b.d ? 1 : -1), avista = M.B(ym).conta.slice().sort((a, b) => a.d < b.d ? 1 : -1);
  openInfo(`Saídas · ${ymLabel(ym)}`,
    `<div class="kv tot"><span>Total de saídas</span><b class="neg">${brl(d.sai)}</b></div>` +
    (fixos.length ? secHead('Contas fixas', sum(fixos, x => x.v)) + fixos.map(x => `<div class="kv"><span>${esc(x.f.name)}</span><b>${brl(x.v)}</b></div>`).join('') : '') +
    (fat > 0.004 ? secHead(adv > 0.004 ? 'Cartão (a pagar)' : 'Cartão (fatura do mês)', M.aPagar(ym), adv > 0.004 ? `Fatura de ${brl(fat)} menos ${brl(adv)} já adiantados (pagos antes, não contam de novo).` : '') + cardLines(ym) : '') +
    (va.length && !M.vaSep ? secHead('VA/VR', sum(va, t => t.v)) + va.map(t => txRowSheet(t)).join('') : '') +
    (avista.length ? secHead('À vista (conta)', sum(avista, t => t.v)) + avista.map(t => txRowSheet(t)).join('') : '') +
    (!fixos.length && fat <= 0.004 && !(va.length && !M.vaSep) && !avista.length ? '<p class="mut">Nenhuma saída neste mês.</p>' : ''));
};
ACT.catopen = el => {
  const cat = el.dataset.c, ym = el.dataset.ym || UI.ym, list = M.gastosDaCategoria(ym, cat), tot = sum(list, x => x.v);
  const pay = x => x.src === 'cartao' ? `Cartão${x.n > 1 ? ` ${x.k}/${x.n}` : ''}` : x.src === 'vavr' ? 'VA/VR' : 'Conta';
  openInfo(`${cat} · ${ymLabel(ym)}`, list.length ? `<div class="kv tot"><span>${list.length} ${list.length === 1 ? 'gasto' : 'gastos'}</span><b>${brl(tot)}</b></div>` + list.map(x => `<button class="row" data-act="edtx" data-id="${x.t.id}"><span class="r-main"><b>${esc(x.t.desc || x.t.cat)}</b><span class="tags"><i class="tag">${dmy(x.t.d)}/${x.t.d.slice(0, 4)}</i><i class="tag">${pay(x)}</i></span></span><span class="r-amt">${brl(x.v).replace('−', '')}</span></button>`).join('') : '<p class="mut">Nenhum gasto dessa categoria neste mês.</p>');
};
function cardLines(ym, back) {
  const ins = M.installments(ym).slice().sort((a, b) => a.t.d < b.t.d ? 1 : a.t.d > b.t.d ? -1 : 0);
  const all = M.cardItems(ym).filter(x => Math.abs(x.v) > 0.004);
  const byDue = (a, b) => (a.due || '') < (b.due || '') ? 1 : (a.due || '') > (b.due || '') ? -1 : 0;
  const done = all.filter(x => x.done).sort(byDue), pend = all.filter(x => !x.done).sort(byDue);
  const rowRec = (x, late) => `<div class="rr"><button class="row" data-act="monthedit" data-f="${x.f.id}" data-ym="${ym}"${back ? ' data-back="1"' : ''}${late ? ' style="opacity:.62"' : ''}><span class="r-main"><b>${esc(x.f.name)}</b><span class="tags"><i class="tag pay-cartao">Todo mês</i>${late ? `<i class="tag acc">soma em ${dmy(x.due)}/${x.due.slice(0, 4)}</i>` : ''}</span></span><span class="r-amt">${brl(x.v).replace('−', '')}</span></button>${late ? '' : advChip(ym, x.f.id, x.v)}</div>`;
  const insH = ins.map(x => `<div class="rr"><button class="row" data-act="edtx" data-id="${x.t.id}"><span class="r-main"><b>${esc(x.t.desc || x.t.cat)}</b><span class="tags"><i class="tag">${x.k}/${x.n}</i><i class="tag">${esc(x.t.cat)}</i><i class="tag">compra ${dmy(x.t.d)}</i></span></span><span class="r-amt">${brl(x.v).replace('−', '')}</span></button>${advChip(ym, x.t.id, x.v)}</div>`).join('');
  const sub = (l, v, mut) => `<div class="fat-subh"><span>${l}</span>${mut ? '' : `<b>${brl(v)}</b>`}</div>`;
  return (done.length ? sub('Recorrentes já cobrados', sum(done, x => x.v)) + done.map(x => rowRec(x, false)).join('') : '') +
    (ins.length ? sub('Parcelas de compras', sum(ins, x => x.v)) + insH : '') +
    (pend.length ? sub('Agendados no cartão (somam depois do dia)', 0, true) + pend.map(x => rowRec(x, true)).join('') + `<p class="mut sm">Previsto com os agendados: <b>${brl(M.faturaPlan(ym))}</b></p>` : '') +
    (!done.length && !ins.length && !pend.length ? '<p class="mut sm">Nada no cartão neste mês.</p>' : '');
}

// ---------- INÍCIO ----------
function viewHome() {
  const ym = UI.ym, d = M.dashboard(ym);
  const fixos = sum(M.fixedOf(ym, 'out').filter(x => !x.f.inFatura), x => x.v);
  const fat = M.aPagar(ym), conta = sum(M.B(ym).conta, t => t.v), dia = M.vaCost(ym) + conta; // cartão no cabeçalho = fatura a pagar (já sem os adiantados)
  const denom = Math.max(d.ent, d.sai, 1), w = v => (Math.max(0, v) / denom * 100).toFixed(2);
  const vaSai = M.vaShown(ym), demais = d.sai - fat - vaSai; // demais = fixos + à vista + o que já foi adiantado no cartão (VA/VR em linha própria)
  const seg = [[M.advSum(ym) > 0.004 ? 'Cartão a pagar' : 'Cartão', fat, 's2'], ['VA/VR', vaSai, 's3'], ['Demais saídas', demais, 's1'], ['Sobra', Math.max(0, d.meta), 's4']];
  const vaIn = sum(M.fixedOf(ym, 'in').filter(x => x.f.id === 'f_vavr' || /^va\/vr$/i.test(x.f.name)), x => x.v), vaGasto = sum(d.env.rows, r => r.month), vaAcc = sum(d.env.rows, r => r.bal), vaP = vaIn ? vaGasto / vaIn : 0;
  const vaFromYm = S.envFrom && S.envFrom > S.startYm ? S.envFrom : S.startYm; // o acumulado (que já inclui o mês) só conta a partir daqui
  const vaSaldo = ym >= vaFromYm ? vaAcc : vaIn - vaGasto, vaPrev = ym >= vaFromYm ? vaAcc - (vaIn - vaGasto) : 0; // saldo do cartão VA/VR, separado do saldo do mês
  const entFix = M.fixedIn(ym).filter(x => Math.abs(x.v) > 0.004);
  const entRec = M.aReceber(ym), entOk = d.ent - sum(entFix, x => x.v); // recebido (o "a receber" não entra no total nem na sobra)
  const hrow = (l, val, cls = '', tot = false, dot = '') => `<div class="hl-row${tot ? ' tot' : ''}"><span>${dot ? `<i class="hl-dot ${dot}"></i>` : ''}${l}</span><b class="${cls}">${val}</b></div>`;
  const ajuste = d.meta - (d.ent - d.sai);
  const hlist = `<div class="hlist">
    <button class="hl-sec hl-btn" data-act="hopen" data-k="ent" data-ym="${ym}" aria-label="Ver detalhes das entradas">Entradas <span class="hl-more">Ver detalhes ›</span></button>
    ${entFix.map(x => hrow(esc(x.f.name), brl(x.v), 'pos')).join('')}${Math.abs(entOk) > 0.004 ? hrow('Recebido', brl(entOk), 'pos') : ''}
    ${hrow('Total de entradas', brlS(d.ent), 'pos', true)}${entRec > 0.004 ? hrow('A receber (soma quando receber)', brl(entRec), '') : ''}
    <button class="hl-sec hl-btn" data-act="hopen" data-k="sai" data-ym="${ym}" aria-label="Ver detalhes das saídas">Saídas <span class="hl-more">Ver detalhes ›</span></button>
    ${hrow(M.advSum(ym) > 0.004 ? 'Cartão a pagar' : 'Cartão', brl(fat), 'neg', false, 's2')}${vaSai > 0.004 ? hrow('VA/VR', brl(vaSai), 'neg', false, 's3') : ''}${hrow('Demais saídas', brl(demais), 'neg', false, 's1')}
    ${Math.abs(ajuste) > 0.004 ? hrow('Ajuste', brlS(ajuste)) : ''}
    ${hrow('Sobra', brl(d.meta), signCls(d.meta), true, 's4')}
    ${hasVA() && M.vaSep ? `<div class="hl-sec" style="margin-top:10px">VA/VR (à parte, não entra na sobra)</div>${hrow(`Recebido ${brl(vaIn)} · gasto ${brl(vaGasto)}`, brl(vaSaldo), signCls(vaSaldo))}` : ''}
  </div>`;
  const saldo = d.saldo;
  const hero = `<section class="hero">
    <div class="lab">Saldo do mês</div>
    <div class="num ${saldo < -0.004 ? 'neg' : 'pos'}">${brl(saldo)}</div>
    <p class="sub">${d.meta < 0 ? `Entram ${brl(d.ent)} e saem ${brl(d.sai)}. As saídas passaram das entradas.` : saldo > 0.004 ? `Sobra de ${brl(d.meta)} menos ${brl(d.guardSobra)} já guardados nas caixinhas. Ao guardar, o saldo diminui.` : `A sobra de ${brl(d.meta)} já está guardada nas caixinhas.`}</p>
    ${hlist}
    <div class="flow" role="img" aria-label="Para onde vai a renda do mês">${seg.map(([l, v, c]) => `<i class="${c}" style="width:${w(v)}%"></i>`).join('')}</div>
  </section>`;
  const stats = `<div class="stats${hasVA() ? ' three' : ''}">${stat('Guardado no mês', brl(d.guard), 'acc')}${stat('Sobra do mês', brl(d.meta), signCls(d.meta))}${hasVA() ? stat('Saldo VA/VR', brl(vaSaldo), signCls(vaSaldo)) : ''}</div>`;
  const fut = d.target > M.today;
  const patBody = `
    <p class="mut">${fut ? `Projeção até ${dmy(Core.fromDn(d.target))}/${Core.fromDn(d.target).slice(0, 4)}` : 'Valores de hoje'}</p>
    ${kv('Patrimônio', brl(d.patrimonio))}
    ${kv('Caixinhas', brl(d.cx.tot))}
    ${fut ? kv('Aportes previstos (sobras)', brlS(d.principal - d.cx.tot)) + kv('Rendimento projetado', brlS(d.juros)) : ''}
    ${kv('Investimentos', brl(d.invT))}`;
  const pat = `<section class="card"><button class="card-h btn-h" data-act="tog" data-t="pat" aria-expanded="${UI.open.pat ? 'true' : 'false'}"><h3>Patrimônio</h3><b>${brl(d.total)} <span class="mut">${UI.open.pat ? '▴' : '▾'}</span></b></button>${UI.open.pat ? patBody : ''}</section>`;
  const fatCard = card('Cartão', `
    ${kv(`Fatura de ${ymLabel(ym)}${M.advSum(ym) > 0.004 ? ' (a pagar)' : ''}`, brl(M.aPagar(ym)))}${M.advSum(ym) > 0.004 ? kv('Já adiantado', '−' + brl(M.advSum(ym))) : ''}
    ${kv(`Fatura de ${ymLabel(d.nxt)} até agora`, brl(d.proxFatura))}
    <p class="mut sm">Fecha dia ${S.closeDay || 1}. Parcelas já lançadas mais os itens recorrentes (academia, assinaturas) cujo dia de cobrança já passou.</p>
    <button class="hl-btn" data-act="openfat" data-ym="${ym}" style="margin-top:.6rem"><span>Parcelas, recorrentes e agendados</span><span class="hl-more">Ver detalhes ›</span></button>`);
  const zerado = S.vaFrom && S.vaFrom.slice(0, 7) === ym && S.vaFrom.slice(8, 10) !== '01';
  const envs = dd('env', 'VA/VR do mês · restante', brl(vaIn - vaGasto), kv('Recebido no cartão VA/VR', brl(vaIn)) + kv(zerado ? `Gasto desde ${dmy(S.vaFrom)}` : 'Gasto no mês', brl(vaGasto)) + `<div class="hb-b ${vaP > 1 ? 'over' : ''}"><i style="width:${Math.min(100, vaP * 100)}%"></i></div><div class="kv tot"><span>Restante do mês</span><b class="${signCls(vaIn - vaGasto)}">${brl(vaIn - vaGasto)}</b></div>` + (Math.abs(vaPrev) > 0.004 ? kv('Acumulado de meses anteriores', brlS(vaPrev)) : '') + `<div class="chips" style="margin:.6rem 0"><button class="chip sm" data-act="addenv">+ Lançar</button>${((typeof SHARE !== 'undefined' && SHARE) ? [] : ['Combustível', 'Troca com o Pai']).filter(c => S.cats.includes(c)).map(c => `<button class="chip sm" data-act="addenv" data-c="${c}">${c}</button>`).join('')}</div><p class="mut sm">Você tem ${brl(vaIn)} por mês e vai lançando conforme gasta. O que sobra acumula${S.envFrom && S.envFrom > S.startYm ? ` a partir de ${ymLabel(S.envFrom)}` : ''} e entra no patrimônio.</p><button class="link" data-act="envreset">Zerar VA/VR</button>`);
  const cats = M.porCategoria(ym);
  const catCard = dd('cat', 'Gastos por categoria', brl(sum(cats, c => c.v)), cats.length ? cats.slice(0, 7).map(c => `<button class="hb-btn" data-act="catopen" data-c="${esc(c.c)}" data-ym="${ym}" aria-label="Ver gastos de ${esc(c.c)}">${bars([{ l: c.c, v: c.v }], cats[0].v)}</button>`).join('') + `<p class="mut sm">Toque em uma categoria para ver os gastos do mês. Compras no cartão entram parceladas, mês a mês.</p>` : empty('Sem gastos neste mês', 'Registre uma saída para ver a divisão por categoria.'));
  const rows = d.cx.rows.slice().sort((a, b) => b.atual - a.atual).slice(0, 5);
  const cxCard = dd('cxd', 'Caixinhas', brl(d.cx.tot), rows.map(r => kv(esc(r.c.name), brl(r.atual))).join('') + `<div class="kv tot"><span>Total</span><b>${brl(d.cx.tot)}</b></div><button class="link" data-act="go" data-tab="cx">Ver todas as caixinhas</button>`);
  const iv = M.invest();
  const invCard = dd('inv', 'Carteira de investimentos', brl(iv.total), iv.classes.map(c => kv(esc(c.c.name), `${brl(c.v)} <small class="mut">${pct(c.atual, 0)} de ${pct(c.meta, 0)}</small>`)).join('') + `<div class="kv tot"><span>Total</span><b>${brl(iv.total)}</b></div><button class="link" data-act="openinv">Ver investimentos e rebalancear</button>`);
  const pendAll = S.tx.filter(t => t.t === 'in' && t.st === 'rec').sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0), pend = pendAll.filter(t => t.d.slice(0, 7) === ym);
  const recRows = pend.map(t => `<div style="display:flex;align-items:center;gap:.5rem"><button class="row" style="flex:1" data-act="edtx" data-id="${t.id}"><span class="r-main"><b>${esc(t.desc)}</b><span class="tags"><i class="tag">${esc(t.cat)}</i><i class="tag ${t.d < TODAY ? 'neg' : 'acc'}">${t.d < TODAY ? 'venceu ' : ''}${dmy(t.d)}/${t.d.slice(0, 4)}</i></span></span><span class="r-amt pos">+${brl(t.v).replace('−', '')}</span></button><button class="chip sm" data-act="recv" data-id="${t.id}">Recebi</button></div>`).join('');

  const recCard = pendAll.length ? `<section class="card"><button class="card-h btn-h" data-act="tog" data-t="rec" aria-expanded="${UI.open.rec ? 'true' : 'false'}"><h3>A receber em ${ymLabel(ym)}</h3><b>${brl(sum(pend, t => t.v))} <span class="mut">${UI.open.rec ? '▴' : '▾'}</span></b></button>${UI.open.rec ? recBody : ''}</section>` : '';
  const envShow = (vaIn > 0.004 || S.env.reduce((s, e) => s + e.monthly, 0) > 0.004) ? envs : '';

}

// ---------- EXTRATO ----------
function viewExt() {
  const tabs = `<div class="seg wide"><button class="${UI.ext === 'lanc' ? 'on' : ''}" data-act="ext" data-v="lanc">Lançamentos</button><button class="${UI.ext === 'rec' ? 'on' : ''}" data-act="ext" data-v="rec">A receber${nRec() ? ` (${nRec()})` : ''}</button><button class="${UI.ext === 'meses' ? 'on' : ''}" data-act="ext" data-v="meses">Mês a mês</button></div>`;
  return tabs + (UI.ext === 'lanc' ? viewLanc() : UI.ext === 'rec' ? viewRec() : viewMeses());
}
const nRec = () => S.tx.filter(t => t.t === 'in' && t.st === 'rec').length;
function viewRec() {
  const ym = UI.ym, all = S.tx.filter(t => t.t === 'in' && t.st === 'rec').sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
  const pend = all.filter(t => t.d.slice(0, 7) === ym);
  const late = all.filter(t => t.d < TODAY);
  const head = `<div class="stats">${stat('A receber em ' + ymLabel(ym), brl(sum(pend, t => t.v)), 'pos')}${stat('Atrasado (todos os meses)', brl(sum(late, t => t.v)), late.length ? 'neg' : '')}</div>`;
  const add = `<div class="pad"><button class="btn primary" style="width:100%" data-act="addrec">+ Novo a receber</button></div>`;
  const g = {}; all.forEach(t => { const k = t.d.slice(0, 7); if (k !== ym) g[k] = (g[k] || 0) + t.v; });
  const outros = Object.keys(g).length ? `<div class="rh"><span style="font-size:15px;font-weight:800;color:inherit">Em outros meses</span><span>${brl(sum(all.filter(t => t.d.slice(0, 7) !== ym), t => t.v))}</span></div><div class="chips pad">${Object.keys(g).sort().map(k => `<button class="chip sm" data-act="gomes" data-ym="${k}">${ymLabel(k)} · ${brl(g[k])}</button>`).join('')}</div>` : '';
  const body = pend.length ? pend.map(t => {
    const l = t.d < TODAY;
    return `<div class="rr"><button class="row" data-act="edtx" data-id="${t.id}"><span class="dbadge ${l ? 'late' : ''}"><b>${t.d.slice(8, 10)}</b><small>${MES[+t.d.slice(5, 7) - 1]}</small></span><span class="r-main"><b>${esc(t.desc)}</b><span class="tags"><i class="tag">${esc(t.cat)}</i>${l ? '<i class="tag neg">venceu</i>' : ''}</span></span><span class="r-amt pos">+${brl(t.v).replace('−', '')}</span></button><button class="chip sm" data-act="recv" data-id="${t.id}">Recebi</button></div>`;
  }).join('') + `<div class="kv tot"><span>Total de ${ymLabel(ym)}</span><b>${brl(sum(pend, t => t.v))}</b></div>` : empty('Nada a receber em ' + ymLabel(ym), all.length ? 'Toque em outro mês abaixo ou use as setas do topo.' : 'Lance uma entrada com situação “A receber” e a data prevista.');
  return monthNav() + head + add + body + outros;
}
ACT.gomes = el => { UI.ym = el.dataset.ym; render(); window.scrollTo && window.scrollTo(0, 0); };
ACT.addrec = () => openEntry({ mode: 'in', st: 'rec', d: TODAY });
ACT.gorec = () => { UI.tab = 'ext'; UI.ext = 'rec'; UI.sub = null; const p = S.tx.filter(t => t.t === 'in' && t.st === 'rec').map(t => t.d.slice(0, 7)).sort(); if (p.length && !p.includes(UI.ym)) UI.ym = p.find(k => k >= M.curYm) || p[0]; render(); };
function txRow(t) {
  const isIn = t.t === 'in';
  const tags = `<i class="tag">${esc(t.cat)}</i>${isIn && t.st === 'rec' ? `<i class="tag acc">A receber ${dmy(t.d)}</i>` : ''}${t.recFor ? '<i class="tag">Repasse</i>' : ''}${isIn ? '' : `<i class="tag pay-${t.pay}">${PAY[t.pay] || ''}${t.pay === 'cartao' && t.par > 1 ? ` ${t.par}×` : ''}</i>`}`;
  return `<button class="row" data-act="edtx" data-id="${t.id}"><span class="r-main"><b>${esc(t.desc)}</b><span class="tags">${tags}</span></span><span class="r-amt ${isIn ? 'pos' : ''}">${isIn ? '+' : '−'}${brl(t.v).replace('−', '')}</span></button>`;
}
function apRow(a) {
  return `<button class="row" data-act="edap" data-id="${a.id}"><span class="r-main"><b>${a.v < 0 ? 'Resgate' : 'Guardado'} em ${esc(a.cx)}</b><span class="tags"><i class="tag acc">Caixinha</i>${a.re ? '<i class="tag">Realocação</i>' : a.ext ? '<i class="tag">De terceiros</i>' : ''}</span></span><span class="r-amt acc">${brlS(a.v)}</span></button>`;
}
function viewLanc() {
  const ym = UI.ym; let items = [];
  S.tx.filter(t => t.d.startsWith(ym)).forEach(t => items.push({ k: 'tx', t, d: t.d, n: parseInt(t.id.slice(1)) }));
  S.ap.filter(a => a.d.startsWith(ym)).forEach(a => items.push({ k: 'ap', a, d: a.d, n: parseInt(a.id.slice(1)) }));
  const f = UI.filter;
  items = items.filter(i => f === 'all' || (f === 'out' && i.k === 'tx' && i.t.t === 'out') || (f === 'in' && i.k === 'tx' && i.t.t === 'in') || (f === 'ap' && i.k === 'ap'));
  items.sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : b.n - a.n);
  const chips = [['all', 'Tudo'], ['out', 'Saídas'], ['in', 'Entradas'], ['ap', 'Guardado']].map(([k, l]) => `<button class="chip ${f === k ? 'on' : ''}" data-act="filter" data-v="${k}">${l}</button>`).join('');
  let list = '';
  if (!items.length) list = empty(`Nada em ${MES_L[+ym.slice(5, 7) - 1]}`, 'Toque no + para registrar uma saída, entrada ou aporte.');
  else {
    const groups = {};
    items.forEach(i => (groups[i.d] = groups[i.d] || []).push(i));
    list = Object.keys(groups).map(day => {
      const dn = Core.pd(day), wd = DIA[(dn + 4) % 7];
      const tot = sum(groups[day].filter(i => i.k === 'tx'), i => i.t.t === 'in' ? i.t.v : -i.t.v);
      return `<div class="day"><span>${wd}, ${+day.slice(8, 10)} ${MES[+day.slice(5, 7) - 1].toLowerCase()}</span>${groups[day].some(i => i.k === 'tx') ? `<b class="${signCls(tot)}">${brlS(tot)}</b>` : ''}</div>` + groups[day].map(i => i.k === 'tx' ? txRow(i.t) : apRow(i.a)).join('');
    }).join('');
  }
  const ent = M.entradas(ym), sai = M.saidasConf(ym);
  const summary = `<div class="stats">${stat('Entradas', brl(ent), 'pos')}${stat('Saídas', brl(sai), 'neg')}</div>`;
  // fixos + fatura
  const fx = M.fixedOf(ym, 'in').concat(M.fixedOf(ym, 'out')).filter(x => Math.abs(x.v) > 0.004 && !x.f.inFatura);
  const fixCard = `<section class="card"><button class="card-h btn-h" data-act="tog" data-t="fx"><h3>Contas fixas do mês</h3><span class="mut">${UI.open.fx ? 'Ocultar' : 'Ver'}</span></button>${UI.open.fx ? fx.map(x => `<button class="row" data-act="monthedit" data-f="${x.f.id}" data-ym="${ym}"><span class="r-main"><b>${esc(x.f.name)}</b><span class="tags"><i class="tag">${x.f.kind === 'in' ? 'Entrada' : 'Saída'}</i>${typeof Core.schedAt(x.f.sched, ym) === 'string' ? `<i class="tag">${esc(Core.schedAt(x.f.sched, ym))}</i>` : ''}</span></span><span class="r-amt ${x.f.kind === 'in' ? 'pos' : ''}">${x.f.kind === 'in' ? '+' : '−'}${brl(x.v).replace('−', '')}</span></button>`).join('') + `<button class="link" data-act="openfix">Gerenciar itens fixos</button>` : ''}</section>`;
  const adv = M.advSum(ym), fatH = adv > 0.004 ? `<div class="kv"><span>Total da fatura</span><b>${brl(M.fatura(ym))}</b></div><div class="kv"><span>Já adiantado</span><b class="pos">−${brl(adv)}</b></div>` : '';
  const fatCard = `<section class="card"><button class="card-h btn-h" data-act="togd" data-t="ft"><h3>Fatura do cartão em ${ymLabel(ym)}${adv > 0.004 ? ' · a pagar' : ''}</h3><b>${brl(M.aPagar(ym))}</b></button>${UI.open.ft === false ? '' : fatH + cardLines(ym)}</section>`;
  return monthNav() + summary + `<div class="chips pad">${chips}</div>` + list + fixCard + fatCard;
}

function viewMeses() {
  const y = UI.year, rows = [];
  for (let i = 1; i <= 12; i++) {
    const ym = `${y}-${pad(i)}`;
    const ent = M.entradas(ym), sai = M.saidasConf(ym);
    const fixos = sum(M.fixedOf(ym, 'out').filter(x => !x.f.inFatura), x => x.v), fat = M.aPagar(ym);
    rows.push({ ym, ent, fixos, fat, dia: sai - fixos - fat, sai, sob: ent - sai });
  }
  const max = Math.max(1, ...rows.map(r => Math.abs(r.sob)));
  const W = 336, H = 120, mid = 62, bw = W / 12;
  const svg = `<svg viewBox="0 0 ${W} ${H}" class="mchart" role="img" aria-label="Sobra por mês em ${y}"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" class="axis"/>${rows.map((r, i) => { const h = Math.abs(r.sob) / max * 50; const x = i * bw + 4; return `<rect x="${x}" y="${r.sob >= 0 ? mid - h : mid}" width="${bw - 8}" height="${Math.max(h, 1)}" rx="3" class="${r.sob >= 0 ? 'bp' : 'bn'} ${r.ym === CUR_YM ? 'cur' : ''}"/><text x="${x + (bw - 8) / 2}" y="${H - 4}" text-anchor="middle" class="ax">${MES[i][0]}</text>`; }).join('')}</svg>`;
  const tot = { ent: sum(rows, r => r.ent), sai: sum(rows, r => r.sai), sob: sum(rows, r => r.sob) };
  const table = `<div class="tscroll"><table class="tbl"><thead><tr><th>Mês</th><th>Entradas</th><th>Fixos</th><th>Cartão</th><th>Dia a dia</th><th>Saídas</th><th>Sobra</th></tr></thead><tbody>${rows.map(r => `<tr class="${r.ym === CUR_YM ? 'cur' : ''}" data-act="monthopen" data-ym="${r.ym}" role="button" tabindex="0"><th>${MES[+r.ym.slice(5, 7) - 1]}</th><td>${fmtNum(r.ent)}</td><td>${fmtNum(r.fixos)}</td><td>${fmtNum(r.fat)}</td><td>${fmtNum(r.dia)}</td><td>${fmtNum(r.sai)}</td><td class="${signCls(r.sob)}">${r.sob < -0.004 ? '−' : ''}${fmtNum(r.sob)}</td></tr>`).join('')}</tbody><tfoot><tr><th>Ano</th><td>${fmtNum(tot.ent)}</td><td></td><td></td><td></td><td>${fmtNum(tot.sai)}</td><td class="${signCls(tot.sob)}">${tot.sob < -0.004 ? '−' : ''}${fmtNum(tot.sob)}</td></tr></tfoot></table></div>`;
  return `<div class="mnav"><button class="ib" data-act="yr" data-d="-1" aria-label="Ano anterior">${icon('left', 20)}</button><button class="mlabel" data-act="yrnow">${y}</button><button class="ib" data-act="yr" data-d="1" aria-label="Próximo ano">${icon('right', 20)}</button></div>` +
    card('Sobra mês a mês', svg) + `<p class="mut sm pad">Toque em um mês para ver o detalhe e ajustar valores fixos.</p>` + table;
}

function monthDetail(ym) {
  const back = () => monthDetail(ym);
  const fx = f => M.fixedOf(ym, f).filter(x => !x.f.inFatura).map(x => `<button class="row" data-act="monthedit" data-f="${x.f.id}" data-ym="${ym}" data-back="1"><span class="r-main"><b>${esc(x.f.name)}</b>${typeof Core.schedAt(x.f.sched, ym) === 'string' ? `<span class="tags"><i class="tag">${esc(Core.schedAt(x.f.sched, ym))}</i></span>` : ''}</span><span class="r-amt">${brl(x.v).replace('−', '')}</span></button>`).join('');
  const txin = M.B(ym).in;
  const ent = M.entradas(ym), sai = M.saidasConf(ym), conta = sum(M.B(ym).conta, t => t.v);
  const html = `<h4>Entradas <b class="pos">${brl(ent)}</b></h4>${fx('in')}${txin.map(t => `<div class="kv"><span>${esc(t.cat)}: ${esc(t.desc)}</span><b>${brl(t.v)}</b></div>`).join('')}
    <h4>Saídas <b class="neg">${brl(sai)}</b></h4>${fx('out')}
    <h4>Fatura do cartão <b>${brl(M.fatura(ym))}</b></h4>${cardLines(ym, true)}
    ${S.env.map(e => kv(`VA/VR · ${esc(e.name)}`, brl(e.monthly))).join('')}
    ${conta ? kv('Pix/débito lançados', brl(conta)) : ''}
    <div class="kv tot"><span>Sobra</span><b class="${signCls(ent - sai)}">${brl(ent - sai)}</b></div>`;
  openInfo(ymLong(ym), html);
}

function viewCx() {
  const ym = UI.ym, d = M.dashboard(ym), fut = d.target > M.today;
  const projRows = new Map(d.pj.rows.map(r => [r.c.id, r.proj]));
  const totals = card('Total nas caixinhas', `<div class="big">${brl(d.cx.tot)}</div>
    ${kv('Guardado', brl(d.cx.guardado))}${kv('Rendimento acumulado', brlS(d.cx.rend), 'pos')}${kv('Líquido estimado (IOF e IR)', brl(d.cx.liquido))}
    ${fut ? kv(`Projeção em ${ymLabel(ym)}`, brl(d.pj.tot), 'acc') : ''}
    <div class="row-btns"><button class="btn primary" data-act="distrib">Distribuir a sobra</button><button class="btn" data-act="add" data-m="ap">Guardar</button></div>`);
  const selic = `<section class="card"><div class="card-h"><h3>Selic ao ano</h3><label class="inl"><input class="in sm" inputmode="decimal" data-inv="selic" value="${String(S.selic).replace('.', ',')}" aria-label="Selic ao ano em porcentagem"><span>%</span></label></div><p class="mut sm">Atualize quando a Selic mudar. Os rendimentos usam dias úteis, base 252.</p></section>`;
  const list = d.cx.rows.map(r => `<button class="cx" data-act="cxedit" data-id="${r.c.id}">
      <div class="cx-t"><b>${esc(r.c.name)}</b><b>${brl(r.atual)}</b></div>
      <div class="cx-b"><span>Guardado ${brl(r.guardado)}</span><span class="pos">${brlS(r.rend)}</span></div>
      <div class="hb-b"><i style="width:${(r.pct * 100).toFixed(1)}%"></i></div>
      <div class="cx-b mut"><span>${pct(r.rate, 2)} ao ano${r.c.mult !== 1 ? ` (${Math.round(r.c.mult * 100)}% da Selic)` : ''}, ${r.dias} dias úteis</span><span>${pct(r.pct, 1)} do total</span></div>
      ${fut ? `<div class="cx-b"><span>Projeção em ${ymLabel(ym)}</span><b>${brl(projRows.get(r.c.id) || 0)}</b></div>` : ''}
      ${r.c.note ? `<div class="cx-n">${esc(r.c.note)}</div>` : ''}
    </button>`).join('');
  const aps = S.ap.slice().sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : parseInt(b.id.slice(1)) - parseInt(a.id.slice(1))).slice(0, UI.open.allap ? 999 : 8);
  const apCard = card('Aportes recentes', aps.map(a => `<button class="row" data-act="edap" data-id="${a.id}"><span class="r-main"><b>${esc(a.cx)}</b><span class="tags"><i class="tag">${dmy(a.d)}/${a.d.slice(0, 4)}</i>${a.re ? '<i class="tag">Realocação</i>' : a.ext ? '<i class="tag">De terceiros</i>' : ''}</span></span><span class="r-amt ${a.v < 0 ? 'neg' : 'acc'}">${brlS(a.v)}</span></button>`).join('') + (S.ap.length > 8 ? `<button class="link" data-act="tog" data-t="allap">${UI.open.allap ? 'Mostrar menos' : 'Mostrar todos'}</button>` : ''));
  return monthNav() + totals + selic + `<div class="sec-h"><h3>Suas caixinhas</h3><button class="link" data-act="cxnew">Nova caixinha</button></div>` + (S.cx.length ? list : `<section class="card"><p class="mut">Você ainda não tem caixinhas. Crie a primeira — por exemplo, Reserva de emergência, Viagem ou Casa — e depois registre os aportes.</p><button class="btn primary" data-act="cxnew">Criar caixinha</button></section>`) + apCard;
}

function viewInv() {
  const iv = M.invest(), I = S.inv;
  const cfg = card('Aporte', `<div class="fld2"><label>Quanto quer investir<input class="in" inputmode="decimal" data-inv="aporte" value="${String(I.aporte).replace('.', ',')}"></label><label>Divisor da base<input class="in" inputmode="decimal" data-inv="divisor" value="${String(I.divisor).replace('.', ',')}"></label></div><p class="mut sm">O divisor repete a conta da planilha: cada percentual é o valor do ativo dividido pelo total da carteira e por este número.</p>${kv('Total da carteira', brl(iv.total))}`);
  const qc = card('Cotações', `<p class="mut sm">${esc(invQuoteStatus())}</p><div class="row-btns"><button class="btn primary" data-act="invqauto" ${invQBusy ? 'disabled' : ''}>${invQBusy ? 'Atualizando…' : 'Atualizar automaticamente'}</button><button class="btn" data-act="invqpaste">Colar cotações</button></div>${invQResultHtml()}<p class="mut sm">Automático hoje só funciona para PETR4, VALE3, ITUB4 e MGLU3 — é o que a API gratuita sem cadastro (brapi.dev) libera sem token. Para os demais ativos, use “Colar cotações” com o que você copiar da corretora, do Google ou de uma planilha.</p>`);
  const cl = card('Metas por classe', iv.classes.map(c => `<div class="kv"><span>${esc(c.c.name)} <small class="mut">agora ${pct(c.atual, 1)}</small></span><span class="metaedit"><input class="in xs" inputmode="decimal" data-inv="meta" data-id="${c.c.id}" value="${String(Math.round(c.meta * 1000) / 10).replace('.', ',')}" aria-label="Meta de ${esc(c.c.name)} em porcentagem">%<i class="badge ${c.acao === 'INVESTIR' ? 'pos' : c.acao === 'REDUZIR' ? 'neg' : ''}">${c.acao === 'INVESTIR' ? 'Investir' : c.acao === 'REDUZIR' ? 'Reduzir' : 'Ok'}</i></span></div>`).join(''));
  const assets = I.classes.map(c => {
    const rows = iv.rows.filter(r => r.a.cls === c.id);
    return `<section class="card"><div class="card-h"><h3>${esc(c.name)}</h3><button class="link" data-act="assetnew" data-cls="${c.id}">Novo ativo</button></div>${rows.length ? `<div class="thead"><span>Ativo</span><span>Qtd.</span><span>Cotação</span><span>Total</span></div>` : '<p class="mut sm">Nenhum ativo nesta classe.</p>'}${rows.map(r => `<div class="arow"><button class="tk" data-act="assetedit" data-id="${r.a.id}">${esc(r.a.ticker)}</button><input class="in xs" inputmode="decimal" data-inv="qty" data-id="${r.a.id}" value="${String(r.a.qty).replace('.', ',')}" aria-label="Quantidade de ${esc(r.a.ticker)}"><input class="in xs" inputmode="decimal" data-inv="price" data-id="${r.a.id}" value="${String(r.a.price).replace('.', ',')}" aria-label="Cotação de ${esc(r.a.ticker)}"><b>${fmtNum(r.val)}</b></div>`).join('')}</section>`;
  }).join('');

    save: v => {

      if (wantSep && (isNaN(va) || va <= 0)) return 'Informe quanto é o VA/VR por mês.';
      if (wantSep === !merged && !(wantSep && Math.abs(va - vaNow) > 0.004)) return true; // nada mudou
      const sal = S.fixed.find(f => f.id === 'f_sal'), vf = S.fixed.find(f => f.id === 'f_vavr');
      const months = new Set([cur]); [sal, vf].forEach(f => f && f.sched.forEach(p => { if (p[0] > cur) months.add(p[0]); }));
      const plan = [...months].sort().map(m => [m, sal ? M.fv(sal, m) : 0, vf ? M.fv(vf, m) : 0]);
      if (wantSep && plan.some(p => p[1] + (merged ? 0 : p[2]) < va - 0.004 && merged)) return 'O VA/VR não pode ser maior que o salário.';
      const put = (f, m, val) => { f.sched = f.sched.filter(p => p[0] !== m); f.sched.push([m, Core.round2(val)]); f.sched.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0); };
      commit(S => {
        let s = S.fixed.find(f => f.id === 'f_sal'), x = S.fixed.find(f => f.id === 'f_vavr');
        if (!s) { s = { id: 'f_sal', name: 'Salário', kind: 'in', sched: [] }; S.fixed.push(s); }
        if (!wantSep) { // somar: salário + VA/VR, VA/VR zerado daqui em diante
          plan.forEach(([m, sv, vv]) => { put(s, m, sv + vv); if (x) put(x, m, 0); });
          if (S.env[0]) S.env[0].monthly = 0; S.vaSep = false;
        } else { // separar: tira o VA/VR do salário
          if (!x) { x = { id: 'f_vavr', name: 'VA/VR', kind: 'in', sched: [] }; S.fixed.push(x); }
          plan.forEach(([m, sv, vv]) => { put(s, m, merged ? Math.max(0, sv - va) : sv); put(x, m, va); });
          if (S.env[0]) S.env[0].monthly = Core.round2(va); else S.env.push({ id: 'e_vavr', name: 'VA/VR', monthly: Core.round2(va), cats: ['*'], est: false, grp: 'A' });
          S.vaSep = true;
        }
      }, wantSep ? 'VA/VR separado do salário' : 'VA/VR somado ao salário');
      return true;
    }
  });
};

// ---------- cotações automáticas (B3) ----------
// Fonte: brapi.dev (https://brapi.dev/api/quote/TICKER), sem chave nem cadastro para ler, e
// confirmado com Access-Control-Allow-Origin: * (funciona com fetch() direto do navegador, sem
// proxy). Limitação real: o acesso sem token só responde para 4 tickers de teste da própria
// brapi (PETR4, VALE3, ITUB4, MGLU3); qualquer outro ticker volta 401 pedindo cadastro. Por isso
// "Colar cotações" fica sempre disponível como alternativa que cobre qualquer ativo.
let invQBusy = false, invQResult = null; // resultado da última tentativa automática (não é salvo)
function fmtWhen(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const dIso = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  return (dIso === TODAY ? 'hoje' : `${dmy(dIso)}/${dIso.slice(0, 4)}`) + ` às ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function invQuoteStatus() {
  const list = S.inv.assets.filter(a => a.qAt);
  if (!list.length) return 'Nenhuma cotação foi atualizada automaticamente ou colada ainda: os preços abaixo são os que você digitou.';
  const last = list.reduce((m, a) => a.qAt > m.qAt ? a : m, list[0]);
  return `Última atualização (${last.qSrc === 'auto' ? 'automática' : 'colada'}): ${last.ticker} ${fmtWhen(last.qAt)}. ${list.length} de ${S.inv.assets.length} ativo(s) têm cotação automática ou colada.`;
}
function invQResultHtml() {
  if (!invQResult || !invQResult.fail.length) return '';
  return `<div class="warn sm">Sem cotação automática: ${invQResult.fail.map(f => `${esc(f.tk)} (${esc(f.msg)})`).join(', ')}. Use “Colar cotações” para esses.</div>`;
}
async function fetchQuote(ticker) {
  const tk = String(ticker || '').trim().toUpperCase();
  if (!tk) return { ok: false, msg: 'ticker vazio' };
  let res;
  try { res = await fetch(`https://brapi.dev/api/quote/${encodeURIComponent(tk)}`); }
  catch (e) { return { ok: false, msg: 'falha de rede' }; }
  let data = null; try { data = await res.json(); } catch (e) { }
  if (!res.ok) return { ok: false, msg: res.status === 401 ? 'precisa de cadastro nessa API' : ((data && data.message) || `erro ${res.status}`) };
  const price = data && data.results && data.results[0] && data.results[0].regularMarketPrice;
  if (!(price > 0)) return { ok: false, msg: 'sem cotação disponível' };
  return { ok: true, price: Core.round2(price) };
}
ACT.invqauto = async () => {
  if (invQBusy) return;
  const tickers = uniq(S.inv.assets.map(a => (a.ticker || '').trim().toUpperCase()).filter(Boolean));
  if (!tickers.length) { toast('Nenhum ativo cadastrado ainda.'); return; }
  invQBusy = true; invQResult = null; render();
  const results = await Promise.all(tickers.map(async tk => ({ tk, r: await fetchQuote(tk) })));
  invQBusy = false;
  const ok = results.filter(x => x.r.ok), fail = results.filter(x => !x.r.ok);

function impNum(str) {
  let s = String(str == null ? '' : str).trim().replace(/^R\$\s*/i, '').replace(/\s/g, '');
  if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s[0] === '-') { neg = true; s = s.slice(1); } else if (s[0] === '+') { s = s.slice(1); }
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); // formato BR: ponto = milhar, vírgula = decimal
  const n = parseFloat(s);
  return isFinite(n) ? (neg ? -n : n) : NaN;
}
function impDate(str) {
  const s = String(str || '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) { const d = `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`; return isNaN(new Date(d).getTime()) ? '' : d; }
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) { let [, d, mo, y] = m; if (y.length === 2) y = (+y > 50 ? '19' : '20') + y; const iso = `${y}-${mo.padStart(2, '0')}-${d.padStart(2, '0')}`; return isNaN(new Date(iso).getTime()) ? '' : iso; }
  return '';
}
function impParseOFX(text) {
  const rows = [];
  const isCC = /<CCSTMTRS|<CREDITCARDMSGSRSV1|<CCACCTFROM/i.test(text);
  const blocks = text.split(/<STMTTRN>/i).slice(1);
  for (const raw of blocks) {
    const block = raw.split(/<\/STMTTRN>/i)[0];
    const get = tag => { const m = block.match(new RegExp('<' + tag + '>\\s*([^\\r\\n<]*)', 'i')); return m ? m[1].trim() : ''; };
    const d = impDate(get('DTPOSTED').slice(0, 8).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'));
    const v = impNum(get('TRNAMT'));
    if (!d || !isFinite(v) || Math.abs(v) < 0.005) continue;
    const memo = get('MEMO') || get('NAME') || get('PAYEE') || (v < 0 ? 'Saída' : 'Entrada');
    rows.push({ d, t: v < 0 ? 'out' : 'in', v: Math.round(Math.abs(v) * 100) / 100, desc: memo, pay: isCC ? 'cartao' : 'conta' });
  }

}
function impSplitCSVLine(line, delim) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);

}
function impParseCSV(text) {
  const lines = text.split(/\r\n|\r|\n/).filter(l => l.trim() !== '');
  if (!lines.length) return null;
  const delim = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
  const table = lines.map(l => impSplitCSVLine(l, delim));
  const hasHeader = !table[0].some(c => impDate(c)); // uma linha de dados real sempre tem uma célula com data válida
  const labels = hasHeader ? table[0] : table[0].map((_, i) => 'Coluna ' + (i + 1));
  const dataRows = hasHeader ? table.slice(1) : table;
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const findCol = names => labels.findIndex(h => names.some(n => norm(h).includes(n)));
  return { labels, dataRows, iDate: findCol(['data']), iDesc: findCol(['descri', 'histor', 'memo', 'lancamento', 'nome', 'detalh']), iVal: findCol(['valor', 'montante', 'vlr']) };
}
function impBuildCSVRows(csv, iDate, iDesc, iVal, defPay) {
  const rows = [];
  for (const cols of csv.dataRows) {
    const d = impDate(cols[iDate]), v = impNum(cols[iVal]);
    if (!d || !isFinite(v) || Math.abs(v) < 0.005) continue;
    rows.push({ d, t: v < 0 ? 'out' : 'in', v: Math.round(Math.abs(v) * 100) / 100, desc: (cols[iDesc] || '').trim() || 'Lançamento', pay: defPay });
  }

}
function impHandleText(name, text) {

    if (!rows.length) { openInfo('Importar extrato', '<p class="mut">Não encontrei lançamentos nesse arquivo OFX. Confira se é um extrato exportado do banco.</p>', () => ACT.impstart()); return; }

  const csv = impParseCSV(text);
  if (!csv || !csv.dataRows.length) { openInfo('Importar extrato', '<p class="mut">Não consegui ler esse arquivo como CSV. Confira o formato exportado do banco.</p>', () => ACT.impstart()); return; }
  if (csv.iDate >= 0 && csv.iDesc >= 0 && csv.iVal >= 0) {
    const rows = impBuildCSVRows(csv, csv.iDate, csv.iDesc, csv.iVal, isCC ? 'cartao' : 'conta');
    if (rows.length) { impStartReview(rows); return; }
  }
  IMP = { csv, pay: isCC ? 'cartao' : 'conta' };
  openInfo('Importar extrato', `<p class="mut">Não identifiquei as colunas automaticamente. Escolha qual é qual:</p>
    <div class="fld"><label class="fl">Data</label><select class="in" id="impmapD">${csv.labels.map((h, i) => `<option value="${i}">${esc(h)}</option>`).join('')}</select></div>
    <div class="fld"><label class="fl">Descrição</label><select class="in" id="impmapN">${csv.labels.map((h, i) => `<option value="${i}">${esc(h)}</option>`).join('')}</select></div>
    <div class="fld"><label class="fl">Valor</label><select class="in" id="impmapV">${csv.labels.map((h, i) => `<option value="${i}">${esc(h)}</option>`).join('')}</select></div>
    <div class="sheet-foot"><button type="button" class="btn primary" data-act="impmapok">Continuar</button></div>`, () => ACT.impstart());
}

function impGuessCat(desc, t) {

// ---------- nuvem (Supabase): cada conta guarda seu próprio estado, isolado por login ----------
// localStorage continua sendo o cache local (funciona offline); a nuvem sincroniza por cima,
// salvando o mesmo JSON numa linha só do usuário logado (protegida por Row Level Security).
let cloudSaveTimer = null;

function cloudSave() {
  if (!authUser) return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(() => {
    sb.from('app_state').upsert({ user_id: authUser.id, blob: JSON.stringify(S), updated_at: new Date().toISOString() }).then(() => { }).catch(() => { });
  }, 800);
}

async function startApp(user) {
  authUser = user;
  document.body.classList.remove('auth');
  let remote = null;
  try {
    const { data } = await sb.from('app_state').select('blob').eq('user_id', user.id).maybeSingle();
    remote = data;
  } catch (e) { }
  let isNewAccount = false;
  if (remote && typeof remote.blob === 'string') {
    try { S = migrate(JSON.parse(remote.blob)); } catch (e) { S = migrate(SEED()); }
  } else {
    S = migrate(SEED());
    isNewAccount = true;
    try { await sb.from('app_state').insert({ user_id: user.id, blob: JSON.stringify(S) }); } catch (e) { }
  }
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
  try { applyTheme(localStorage.getItem(THEME_KEY) || 'light'); } catch (e) { }
  if (isNewAccount) startOnboard(); else render();
}

// ---------- boas-vindas: 2-3 perguntas rápidas pra conta nova (antes do 1º render do app) ----------
let OB = null; // { step, closeDay, sal, err }
function startOnboard() {
  OB = { step: 1, closeDay: '', sal: '', err: '' };
  renderOnboard();
}
function finishOnboard() {
  const d = parseInt(OB.closeDay);
  if (d >= 1 && d <= 28) S.closeDay = d;
  const sal = Core.calc(OB.sal || '');
  if (sal > 0) {
    let s = S.fixed.find(f => f.id === 'f_sal');
    if (!s) { s = { id: 'f_sal', name: 'Salário', kind: 'in', sched: [] }; S.fixed.push(s); }
    s.sched.push([CUR_YM, Core.round2(sal)]);
  }
  OB = null;
  document.body.classList.remove('auth');
  save();
  render();
}
function obShell(title, sub, body) {
  document.body.classList.add('auth');
  $('nav').innerHTML = '';
  $('app').innerHTML = `<div class="auth">
    <div class="auth-brand"><span class="auth-logo">${icon('trend', 24)}</span><h1>Controle Financeiro</h1></div>
    <p class="auth-tag">Só mais um minuto pra deixar o app do seu jeito.</p>
    <section class="card auth-card">
      <h3>${esc(title)}</h3>
      ${sub ? `<p class="mut" style="margin:0 0 14px">${esc(sub)}</p>` : ''}
      ${body}
    </section>
  </div>`;
}
function renderOnboard() {
  if (!OB) return;
  if (OB.step === 1) {
    obShell('Você recebe VA/VR?', 'Vale-alimentação ou vale-refeição, separado do salário.', `
      <div class="stack">
        <button class="btn primary" data-act="obVa" data-v="1">Sim, recebo</button>
        <button class="btn" data-act="obVa" data-v="0">Não recebo</button>
      </div>`);
  } else if (OB.step === 2) {
    obShell('O VA/VR fica separado do salário?', 'Isso muda se ele entra ou não na sobra do mês, no seu controle aqui no app.', `
      <div class="stack">
        <button class="btn primary" data-act="obVaSep" data-v="1">Separado (não entra na sobra)</button>
        <button class="btn" data-act="obVaSep" data-v="0">Somado junto com o salário</button>
      </div>`);
  } else if (OB.step === 3) {
    obShell('Fechamento da fatura', 'Compras feitas a partir desse dia entram na fatura do mês seguinte.', `
      ${OB.err ? `<div class="auth-err">${esc(OB.err)}</div>` : ''}
      <div class="fld"><label class="fl">Dia do fechamento (1 a 28)</label><input class="in" id="obClose" type="number" min="1" max="28" inputmode="numeric" value="${esc(OB.closeDay)}"></div>
      <div class="stack">
        <button class="btn primary" data-act="obClose">Continuar</button>
        <button class="btn" data-act="obNoCard">Não uso cartão de crédito</button>
      </div>`);
  } else if (OB.step === 4) {
    obShell('Qual sua renda mensal?', 'Já deixamos o salário lançado como item fixo, pra você não começar do zero.', `
      <div class="fld"><label class="fl">Renda fixa por mês</label><input class="in" id="obSal" inputmode="decimal" placeholder="Ex.: 3500" value="${esc(OB.sal)}"></div>
      <div class="stack">
        <button class="btn primary" data-act="obSal">Continuar</button>
        <button class="btn" data-act="obNoSal">Prefiro configurar depois</button>
      </div>`);
  }
}
ACT.obVa = el => {
  const yes = el.dataset.v === '1';
  if (yes) {
    S.vaSep = true;
    if (!S.env.length) S.env = [{ id: 'e_vavr', name: 'VA/VR', monthly: 750, cats: ['*'], est: false, grp: 'A' }];
    OB.step = 2;
  } else {
    S.vaSep = false;
    S.env = [];
    OB.step = 3;
  }
  renderOnboard();
};
ACT.obVaSep = el => {
  const sep = el.dataset.v === '1';
  if (!sep) { S.vaSep = false; S.env = []; } // somado ao salário: sem controle separado de VA/VR aqui
  OB.step = 3;
  renderOnboard();
};
ACT.obClose = () => {
  const v = ($('obClose') && $('obClose').value || '').trim();
  const d = parseInt(v);
  if (!(d >= 1 && d <= 28)) { OB.err = 'Digite um dia de 1 a 28.'; renderOnboard(); return; }
  OB.closeDay = String(d); OB.err = '';
  OB.step = 4; renderOnboard();
};
ACT.obNoCard = () => { OB.closeDay = ''; OB.step = 4; renderOnboard(); };
ACT.obSal = () => {
  OB.sal = ($('obSal') && $('obSal').value || '').trim();
  finishOnboard();
};
ACT.obNoSal = () => { OB.sal = ''; finishOnboard(); };

function renderAuth() {
  document.body.classList.add('auth');
  $('nav').innerHTML = '';
  $('app').innerHTML = `<div class="auth">
    <div class="auth-brand"><span class="auth-logo">${icon('trend', 24)}</span><h1>Controle Financeiro</h1></div>
    <p class="auth-tag">Organize entradas, saídas, caixinhas e investimentos num só lugar. Seus dados ficam só na sua conta.</p>
    <section class="card auth-card">
      <h3>${authMode === 'signup' ? 'Criar conta' : 'Entrar'}</h3>
      ${authErr ? `<div class="auth-err">${esc(authErr)}</div>` : ''}
      <div class="fld"><label class="fl">E-mail</label><input class="in" id="authEmail" type="email" autocomplete="email" value="${esc(authEmailVal)}"></div>
      <div class="fld" style="margin-bottom:4px"><label class="fl">Senha</label><input class="in" id="authPass" type="password" autocomplete="${authMode === 'signup' ? 'new-password' : 'current-password'}"></div>
      <button class="btn primary auth-btn" data-act="authSubmit" ${authBusy ? 'disabled' : ''}>${authBusy ? 'Aguarde…' : (authMode === 'signup' ? 'Criar conta' : 'Entrar')}</button>
      <button class="link" data-act="authToggle">${authMode === 'signup' ? 'Já tenho conta' : 'Criar uma conta nova'}</button>
    </section>
  </div>`;
}
ACT.authToggle = () => { authMode = authMode === 'signup' ? 'login' : 'signup'; authErr = ''; renderAuth(); };
ACT.authSubmit = async () => {
  const email = ($('authEmail') && $('authEmail').value || '').trim();
  const pass = ($('authPass') && $('authPass').value) || '';
  authEmailVal = email; authErr = '';
  if (!email || !pass) { authErr = 'Preencha e-mail e senha.'; renderAuth(); return; }
  if (pass.length < 6) { authErr = 'A senha precisa ter pelo menos 6 caracteres.'; renderAuth(); return; }
  authBusy = true; renderAuth();
  const call = authMode === 'signup' ? sb.auth.signUp({ email, password: pass }) : sb.auth.signInWithPassword({ email, password: pass });
  const { data, error } = await call;
  authBusy = false;
  if (error) { authErr = error.message; renderAuth(); return; }
  if (authMode === 'signup' && !data.session) { authErr = 'Conta criada! Verifique seu e-mail para confirmar antes de entrar.'; authMode = 'login'; renderAuth(); return; }
  // sessão criada: onAuthStateChange abaixo inicia o app
};
ACT.logout = async () => { try { await sb.auth.signOut(); } catch (e) { } };
sb.auth.onAuthStateChange((event, session) => {
  if (session && session.user) {
    if (!authUser || authUser.id !== session.user.id) startApp(session.user);
  } else {
    authUser = null; authMode = 'login'; authErr = '';
    renderAuth();
  }
});

// inicia o app (sempre o último arquivo do bundle)
if (typeof document !== 'undefined' && document.getElementById('seed')) { boot(); }

</script>
</body>
</html>
